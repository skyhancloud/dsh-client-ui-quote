name: Bug report
description: Report a problem with the plugin
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in an AI reply
        2. Click 引用
        3. Observe the problem
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Harness version
        Browser and OS
